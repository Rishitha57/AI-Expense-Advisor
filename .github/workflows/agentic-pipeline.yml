name: Agentic Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    env:
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests fastapi uvicorn sqlalchemy httpx

      - name: Start FastAPI server for integration tests
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/ai-expense-advisor.log 2>&1 &
          echo $! > /tmp/ai-expense-advisor.pid
          sleep 5

      - name: Run pytest suite
        run: |
          pytest -q

      - name: Stop FastAPI server
        if: always()
        run: |
          if [ -f /tmp/ai-expense-advisor.pid ]; then
            PID=$(cat /tmp/ai-expense-advisor.pid)
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              wait "$PID" 2>/dev/null || true
            fi
            rm -f /tmp/ai-expense-advisor.pid
          fi

      - name: Sync requirements and execution reports to Confluence
        if: ${{ success() }}
        run: |
          python scripts/confluence_sync.py --mode all

      - name: Upload SDLC deliverable reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-deliverable-reports
          path: docs/
